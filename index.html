<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FANDHARN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fffdf4'/%3E%3Cpath d='M6 26 L6 13 L9 13 L9 10 L12 10 L12 13 L15 13 L15 10 L18 10 L18 13 L21 13 L21 10 L24 10 L24 13 L26 13 L26 26 Z' fill='%23c9a36b' stroke='%232b2b2b' stroke-width='2' stroke-linejoin='round'/%3E%3Crect x='13' y='19' width='6' height='7' fill='%237a5a38' stroke='%232b2b2b' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Patrick+Hand&display=swap">
<link rel="stylesheet" href="style.css?v=21">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hud-left">
    <div id="hud-pips" class="pips"></div>
    <div class="hud-line">
      <span id="hud-cursor" class="chip">Plain Cursor</span>
      <span id="hud-upgrades" class="badges"></span>
    </div>
  </div>
  <div class="hud-right">
    <div id="hud-skill" class="skill-chip">SKILL 0/50</div>
    <div id="hud-scribbles" class="purse-chip">0</div>
    <div id="hud-diff" class="diff-chip">NORMAL</div>
    <div class="chip-row">
      <button id="hud-pause" class="mute-chip" title="pause (P)">PAUSE</button>
      <button id="hud-mute" class="mute-chip" title="mute (M)">SOUND ON</button>
    </div>
  </div>
</div>

<button id="skill-button" class="skill-button hidden" aria-label="use skill" title="use skill (right-click)">
  <span id="skill-button-label">SKILL</span>
</button>

<!-- the title screen: three buttons in the corner, the castle behind them -->
<div id="front" class="screen front">
  <div class="front-stack">
    <h1 class="front-title">FANDHARN</h1>
    <button class="front-btn play" data-go="play" data-doodle="#c8433a" data-fill="#c8433a" data-paper="1" data-weight="3.2"><b>PLAY</b></button>
    <button class="front-btn" data-go="bestiary" data-doodle="ink" data-paper="1"><b>BESTIARY</b></button>
    <button class="front-btn" data-go="skins" data-doodle="ink" data-paper="1"><b>SKIN</b></button>
    <button class="front-btn" data-go="more" data-doodle="ink" data-paper="1"><b>MORE</b><i id="more-dot" class="more-dot hidden"></i></button>
  </div>
</div>

<!-- PLAY: the run setup, as the title screen used to be -->
<div id="menu" class="screen popup-screen hidden">
  <div class="popup play-popup" data-doodle="ink" data-paper="1" data-weight="3.4">
    <button class="popup-close" data-go="front" aria-label="close" data-doodle="ink" data-paper="1">&times;</button>
    <div class="modes">
      <button class="mode on" data-mode="ten" data-doodle="#6b4fb0"><b>10 WAVES</b><span>bosses on 5 and 10, then it is over</span></button>
      <button class="mode" data-mode="endless" data-doodle="#b8b2a3"><b>ENDLESS</b><span>no end, a random boss every 5</span></button>
    </div>
    <div class="diffs">
      <button class="diff easy" data-diff="easy" data-doodle="#4c9f70"><b>EASY</b><span>thin enemies, thin crowds</span></button>
      <button class="diff normal" data-diff="normal" data-doodle="#d99a26"><b>NORMAL</b><span>the drawing as intended</span></button>
      <button class="diff hard" data-diff="hard" data-doodle="#c8433a"><b>HARD</b><span>fat HP, packed waves</span></button>
    </div>
    <span id="build-tag" class="build-tag"></span>
  </div>
</div>

<!-- BESTIARY: a book, open on the table -->
<div id="bestiary" class="screen book-screen hidden">
  <div class="book" data-doodle="ink" data-paper="1" data-weight="3.4">
    <button class="book-close" data-go="front" aria-label="close" data-doodle="ink" data-paper="1">&times;</button>
    <div class="page page-left">
      <h2>BESTIARY</h2>
      <div id="beast-list" class="beast-list"></div>
    </div>
    <div class="spine" data-doodle="#b8b2a3" data-weight="1.6"></div>
    <div class="page page-right">
      <div class="beast-view" data-doodle="ink" data-paper="1"><canvas id="beast-canvas" class="beast-canvas"></canvas></div>
      <h3 id="beast-name" class="beast-name"></h3>
      <div id="beast-where" class="beast-where"></div>
      <div id="beast-stats" class="beast-stats"></div>
      <p id="beast-text" class="beast-text"></p>
    </div>
  </div>
</div>

<!-- SKIN: spend the coins -->
<div id="skins" class="screen popup-screen hidden">
  <div class="popup skins-popup" data-doodle="ink" data-paper="1" data-weight="3.4">
    <button class="popup-close" data-go="front" aria-label="close" data-doodle="ink" data-paper="1">&times;</button>
    <h2>SKINS</h2>
    <div class="coin-purse"><i class="coin" data-doodle="#a5741b" data-fill="#f2c230" data-shape="circle" data-weight="2"></i><b id="coin-count">0</b><span>coins</span></div>
    <div id="skin-list" class="skin-list"></div>
    <p class="hint coin-rules">Normal win: 1 coin &middot; Hard win: 2 &middot; Endless: every 10 waves</p>
    <p class="hint save-warn hidden" id="save-warn">this browser is not keeping saves - coins last until the tab closes</p>
  </div>
</div>

<!-- MORE: achievements, relics and chests, the inventory -->
<div id="more" class="screen popup-screen hidden">
  <div class="popup more-popup" data-doodle="ink" data-paper="1" data-weight="3.4">
    <button class="popup-close" data-go="front" aria-label="close" data-doodle="ink" data-paper="1">&times;</button>
    <div id="more-body" class="more-body"></div>
  </div>
</div>

<!-- opening a chest, over whatever is open -->
<div id="chest-modal" class="modal hidden">
  <div class="popup chest-popup" data-doodle="ink" data-paper="1" data-weight="3.4">
    <canvas id="chest-canvas" class="chest-canvas"></canvas>
    <div id="chest-result" class="chest-result"></div>
    <div class="chest-buttons">
      <button id="chest-again" data-doodle="#9a6a36">OPEN ANOTHER <span id="chest-left"></span></button>
      <button id="chest-done" data-doodle="ink">DONE</button>
    </div>
  </div>
</div>

<!-- a skin pack's settings: which of its skins are worn -->
<div id="pack-modal" class="modal hidden">
  <div class="popup pack-popup" data-doodle="ink" data-paper="1" data-weight="3.4">
    <button class="popup-close" id="pack-close" aria-label="close" data-doodle="ink" data-paper="1">&times;</button>
    <h2 id="pack-title">PACK</h2>
    <div id="pack-list" class="pack-list"></div>
  </div>
</div>

<div id="end" class="screen hidden">
  <h2 id="end-title">THE CASTLE FELL</h2>
  <div id="end-body" class="end-body"></div>
  <button data-action="menu" data-doodle="ink">BACK TO THE TITLE</button>
</div>

<!-- BUILD: bump this (and the ?v= on every asset) to beat browser caches -->
<script>window.BUILD_V = "21";</script>
<script src="js/audio.js?v=21"></script>
<script src="js/rough.js?v=21"></script>
<script src="js/config.js?v=21"></script>
<script src="js/save.js?v=21"></script>
<script src="js/entities.js?v=21"></script>
<script src="js/hive.js?v=21"></script>
<script src="js/fx.js?v=21"></script>
<script src="js/deaths.js?v=21"></script>
<script src="js/auger.js?v=21"></script>
<script src="js/trapper.js?v=21"></script>
<script src="js/skills.js?v=21"></script>
<script src="js/offers.js?v=21"></script>
<script src="js/cursors.js?v=21"></script>
<script src="js/skins.js?v=21"></script>
<script src="js/cryo.js?v=21"></script>
<script src="js/relics.js?v=21"></script>
<script src="js/achievements.js?v=21"></script>
<script src="js/hammer.js?v=21"></script>
<script src="js/thunder.js?v=21"></script>
<script src="js/flourish.js?v=21"></script>
<script src="js/doodle.js?v=21"></script>
<script src="js/scrawl.js?v=21"></script>
<script src="js/bestiary.js?v=21"></script>
<script src="js/menu.js?v=21"></script>
<script src="js/more.js?v=21"></script>
<script src="js/ui.js?v=21"></script>
<script src="js/game.js?v=21"></script>
</body>
</html>
