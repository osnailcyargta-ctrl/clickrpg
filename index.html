<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FANDHARN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fffdf4'/%3E%3Cpath d='M6 26 L6 13 L9 13 L9 10 L12 10 L12 13 L15 13 L15 10 L18 10 L18 13 L21 13 L21 10 L24 10 L24 13 L26 13 L26 26 Z' fill='%23c9a36b' stroke='%232b2b2b' stroke-width='2' stroke-linejoin='round'/%3E%3Crect x='13' y='19' width='6' height='7' fill='%237a5a38' stroke='%232b2b2b' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Patrick+Hand&display=swap">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hud-left">
    <div id="hud-pips" class="pips"></div>
    <div class="hud-line">
      <span id="hud-cursor" class="chip">Plain Cursor</span>
      <span id="hud-upgrades" class="badges"></span>
    </div>
  </div>
  <div class="hud-right">
    <div id="hud-skill" class="skill-chip">SKILL 0/50</div>
    <div id="hud-scribbles" class="purse-chip">0</div>
    <div id="hud-diff" class="diff-chip">NORMAL</div>
    <button id="hud-mute" class="mute-chip" title="mute (M)">SOUND ON</button>
  </div>
</div>

<button id="skill-button" class="skill-button hidden" aria-label="use skill" title="use skill (right-click)">
  <span id="skill-button-label">SKILL</span>
</button>

<div id="menu" class="screen">
  <h1>FANDHARN</h1>
  <div class="rules">
    <div class="rule"><b>CLICK</b><span>2-4 damage, 10% crit</span></div>
    <div class="rule"><b>10 WAVES</b><span>bosses on 5 and 10, each with a trick</span></div>
    <div class="rule"><b>5 HP</b><span>one segment per leak</span></div>
    <div class="rule"><b>BUY</b><span>pick 1 of 3 between waves</span></div>
    <div class="rule"><b>8 CURSORS</b><span>each hits for its own number</span></div>
    <div class="rule"><b>SKILLS</b><span>50 clicks, then right-click</span></div>
  </div>
  <div class="diffs">
    <button class="diff easy" data-diff="easy"><b>EASY</b><span>thin enemies, thin crowds</span></button>
    <button class="diff normal" data-diff="normal"><b>NORMAL</b><span>the drawing as intended</span></button>
    <button class="diff hard" data-diff="hard"><b>HARD</b><span>fat HP, packed waves</span></button>
  </div>
  <p class="hint">mouse or touch &mdash; same thing <span id="build-tag" class="build-tag"></span></p>
</div>

<div id="end" class="screen hidden">
  <h2 id="end-title">THE CASTLE FELL</h2>
  <div id="end-body" class="end-body"></div>
  <button data-action="menu">BACK TO THE TITLE</button>
</div>

<!-- BUILD: bump this (and the ?v= on every asset) to beat browser caches -->
<script>window.BUILD_V = "10";</script>
<script src="js/audio.js?v=10"></script>
<script src="js/rough.js?v=10"></script>
<script src="js/config.js?v=10"></script>
<script src="js/entities.js?v=10"></script>
<script src="js/skills.js?v=10"></script>
<script src="js/offers.js?v=10"></script>
<script src="js/cursors.js?v=10"></script>
<script src="js/ui.js?v=10"></script>
<script src="js/game.js?v=10"></script>
</body>
</html>
